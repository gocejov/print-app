# Use with: docker compose -p qr2share-live -f docker-compose.yml -f deploy/compose.live.yml
# Production loads a prebuilt image; this avoids building on the small live server.
services:
  app:
    init: true
    image: ${QR2SHARE_IMAGE:?Set QR2SHARE_IMAGE in .env}
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  mongo:
    restart: always
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  redis:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Restored volumes are external so Compose cannot delete them with down -v.
volumes:
  mongo_data:
    external: true
    name: qr2share-live_mongo_data
  uploads_data:
    external: true
    name: qr2share-live_uploads_data
